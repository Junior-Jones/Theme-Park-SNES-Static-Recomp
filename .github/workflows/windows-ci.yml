name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-test:
    name: windows-build-test
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Preserve committed source bytes
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify source inventory and distribution exclusions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content SOURCE-MANIFEST.json -Raw | ConvertFrom-Json
          foreach ($entry in $manifest.files.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath $entry.Name -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value.sha256) {
              throw "Source manifest mismatch: $($entry.Name)"
            }
          }
          $forbidden = @(git ls-files | Where-Object { $_ -match '(?i)\.(sfc|smc|srm|sav|state|scsnap|tpsnap|exe|dll|pdb|log|bmp|wav)$|(^|/)settings\.ini$' })
          if ($forbidden.Count) { throw "Forbidden distribution files: $forbidden" }
      - name: Configure Visual Studio 2022 x64
        run: cmake -S frontend/frontend/windows -B "$env:RUNNER_TEMP/static-recomp-build" -G "Visual Studio 17 2022" -A x64 -DTHEME_PARK_BUILD_TESTS=ON
      - name: Compile production core and Launcher
        run: cmake --build "$env:RUNNER_TEMP/static-recomp-build" --config Release --parallel 4
      - name: Run ROM-free launcher and graphics regression tests
        run: ctest --test-dir "$env:RUNNER_TEMP/static-recomp-build" -C Release --output-on-failure --no-tests=error
      - name: Install manifest validator
        run: python -m pip install jsonschema==4.23.0
      - name: Validate official launcher schema and release ZIP
        run: python tools/verify_launcher_release.py --release-dir "$env:RUNNER_TEMP/static-recomp-build/release" --zip "$env:RUNNER_TEMP/Theme-Park-SNES-Static-Recomp-1.0.1-Windows-x64.zip"
      - name: Verify release executable
        shell: pwsh
        run: |
          $exe = Get-Item "$env:RUNNER_TEMP/static-recomp-build/release/Launcher.exe"
          if ($exe.VersionInfo.FileVersion -ne '1.0.1') { throw 'Incorrect release version' }
          Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256
          Write-Output 'Production compile, ROM-free regression tests, launcher schema and packaging checks passed. ROM gameplay and audio are not tested by this workflow.'
      - name: Upload verified Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Theme-Park-1.0.1-Windows-x64
          path: ${{ runner.temp }}/Theme-Park-SNES-Static-Recomp-1.0.1-Windows-x64.zip
          if-no-files-found: error
